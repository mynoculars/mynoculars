# Run the test suite. Nothing else (D-154).
#
# The badge this produces means exactly one thing -- "the tests pass" -- and
# that is the point. Ruff is configured in pyproject.toml and the repository
# passes it cleanly, but it is deliberately NOT run here yet: a badge that
# quietly covers two things is a badge nobody can read.
#
# This works with no services because the suite genuinely needs none. That
# is not luck; it is D-140 and D-147:
#   - stores are constructed with probe=False and open no sockets;
#   - an autouse fixture removes the .env file and every Settings-mapped
#     environment variable for the whole run.
# So there is no Postgres, Qdrant, OpenSearch or API key to provision, and
# nothing here can pass locally and fail in CI because of configuration.
name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:      # so you can run it by hand from the Actions tab

# Read-only: this workflow checks out code and runs a suite. It publishes
# nothing and comments on nothing, so it needs no write scope.
permissions:
  contents: read

# A new push to the same branch cancels the run still going for the old one.
# (D-161: this comment sat above `permissions:` and described the block
# below it.)
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # the suite takes well under a minute; this is a
                          # ceiling for a hang, not an expectation

    steps:
      # @v5, not @v4, and @v6 for setup-python below (D-161). Both v4 and
      # v5 are node20 actions; runners have forced them onto Node 24 since
      # 2026-06-16 and print a deprecation warning, and Node 20 is REMOVED
      # from runners on 2026-09-23 -- at which point these stop warning and
      # start failing. Nothing else about either action changes across
      # those majors for a checkout + setup-python + pytest job.
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # pyproject.toml declares requires-python = ">=3.11". 3.11 is what
          # this project is actually TESTED on -- which is a narrower claim
          # than the declaration makes, and the gap is deliberate rather
          # than overlooked: widening to a matrix, or narrowing the
          # declaration to "==3.11.*", are both real options and neither
          # has been taken yet. (D-161: this comment previously stated the
          # declaration as "==3.11.*", which is not what pyproject says.)
          python-version: "3.11"
          cache: pip
          # pyproject.toml belongs here too: `pip install -e .` below
          # resolves THIS project's own dependencies from it, so a change
          # to them must invalidate the cache. Without it, editing
          # [project.dependencies] leaves CI resolving against a stale
          # wheel cache (D-161).
          cache-dependency-path: |
            requirements.txt
            requirements-websearch.txt
            pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is the core install. requirements-websearch.txt
          # is included because a handful of tests import the websearch
          # package directly; without it they skip rather than fail, so the
          # run would be green while covering less than it appears to.
          pip install -r requirements.txt -r requirements-websearch.txt
          pip install pytest-xdist
          pip install -e .

      - name: Run the suite
        # pytest.ini already sets `-n auto --dist loadfile`; nothing is
        # passed here so that CI runs exactly what a developer runs locally.
        run: python -m pytest tests/ -q
