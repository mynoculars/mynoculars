# Optional infrastructure. The agent runs WITHOUT any of these (graceful
# degradation: in-memory checkpointer, memory-off, retrieval-off) — start
# them to get durability, semantic memory, and corpus retrieval.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports: ["5432:5432"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Agent-Dev-1!"
    ports: ["9200:9200"]
