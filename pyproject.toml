# =============================================================================
# Packaging, and how another project should depend on this one.
#
# WHY THIS FILE EXISTS: until now this repo was run exclusively via
# `PYTHONPATH=src python -m research_agent.cli`, with one monolithic
# requirements.txt. That works for a developer sitting in the checkout; it
# gives a SEPARATE project nothing to depend on. This file makes the repo
# build an installable artifact so a consumer can pin a version rather than
# vendoring a path.
#
# CONSUMING PROJECT -- pick the smallest extra that covers your use:
#     pip install research-agent                # library + CLI only
#     pip install research-agent[api]           # + the FastAPI HTTP surface
#     pip install research-agent[api,langfuse]  # + observability
#     pip install research-agent[all]           # everything requirements.txt has
#
# From a git URL, until this is published to an index:
#     pip install "research-agent[api] @ git+ssh://...@v0.3.0"
# Pin the TAG, never a branch -- see the versioning note below for why.
#
# VERSIONING: manual SemVer in the `version` field below, bumped in the same
# commit as the change it describes, and tagged. Deliberately not derived
# from git (setuptools-scm et al.) -- that adds a build-time dependency and
# makes the version invisible when reading the file, and this project has
# exactly one publisher.
#   PATCH  bug fix, no interface change            (0.3.0 -> 0.3.1)
#   MINOR  new capability, existing callers fine   (0.3.0 -> 0.4.0)
#   MAJOR  a consumer must change code             (0.3.0 -> 1.0.0)
#
# WHAT COUNTS AS THIS PACKAGE'S PUBLIC INTERFACE, i.e. what a MAJOR bump is
# owed for. Stated explicitly because "it's all importable" is not an answer
# once someone else depends on you:
#     research_agent.assembly   build_app_and_settings(), AppBundle
#     research_agent.api.server the /research, /resume, /health request and
#                               response shapes
#     every console script's NAME and arguments -- all ten of them since
#                               D-157, not just `research-agent`. A name
#                               baked into someone's Dockerfile or systemd
#                               unit breaks as loudly as an import does
#     research_agent.servers    the two MCP servers' --host/--port flags and
#                               the tool names they expose over the wire
#     the .env setting NAMES in config.py (renaming one breaks deployments)
# Everything else -- agents/, orchestration/, retrieval/, prompts/, and the
# internals of langfuse/ -- is internal and may change in a MINOR release.
#
# NOTE ON requirements.txt: it stays, unchanged, and still works
# (`pip install -r requirements.txt` for a dev checkout). It is now the
# development pin-set; THIS file is what a consumer resolves against. If you
# add a dependency, add it to both or they will drift.
# =============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.3.0"
description = "Agentic research assistant: LangGraph workflow with hybrid retrieval, semantic memory, human-in-the-loop escalation and Langfuse observability."
readme = "README.md"
# 3.11 because that is what this project is actually tested on. The source
# needs 3.10+ at minimum (api/server.py uses PEP 604 `str | None` with no
# `from __future__ import annotations`), but claiming 3.10 support without
# running the suite on 3.10 would be an untested assertion -- widen this
# only after a real 3.10 run.
requires-python = ">=3.11"

# CORE: everything `python -m research_agent.cli` needs. Each storage
# backend degrades gracefully at RUNTIME when its server is unreachable
# (see storage/*.py), but the client libraries themselves are not
# optional -- assembly.py imports all of them at module level, so a core
# install must be able to build the graph.
dependencies = [
    "langgraph>=0.2.60",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "qdrant-client>=1.14",
    "fastembed>=0.3",
    "opensearch-py>=2.6",
    "langgraph-checkpoint-postgres>=2.0",
    # [pool] adds psycopg_pool -- see requirements.txt for why the fan-out's
    # checkpoint writes need it.
    "psycopg[binary,pool]>=3.1",
    "pywin32>=311; platform_system == 'Windows'",
]

# EXTRAS are exactly the dependencies whose code paths are OFF BY DEFAULT
# and whose imports are lazy, so a core install neither needs nor loads
# them. Each was checked against the source, not assumed:
#   api      -- only api/server.py imports fastapi/uvicorn; nothing else
#               in src/ references either.
#   mcp      -- MCP_ENABLED=false by default; tools/mcp_client.py has no
#               module-level `import mcp`.
#   websearch-- WEB_SEARCH_ENABLED=false by default; ddgs is imported ONLY
#               by scripts/mcp_web_search_server.py (a separate process)
#               and lazily inside websearch/ddgs_provider.py, so a core
#               install neither needs nor loads it. Verified by
#               test_importing_the_package_does_not_require_ddgs.
#   langfuse -- LANGFUSE_ENABLED=false by default; langfuse/client.py's
#               build_client() returns None before importing the SDK.
#   viz      -- cli.py --print-graph falls back to Mermaid text and prints
#               a hint when grandalf is absent.
[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
mcp = ["mcp>=1.9,<2"]
# websearch pulls mcp too: the web tier is reached THROUGH an MCP server,
# so ddgs alone would install a server nothing can talk to.
websearch = ["mcp>=1.9,<2", "ddgs>=9.0,<10"]
langfuse = ["langfuse>=4.0"]
viz = ["grandalf>=0.8"]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]
# Everything, matching what requirements.txt installs today. This is the
# extra a consuming project wants if it does not care about install size.
all = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "mcp>=1.9,<2",
    "ddgs>=9.0,<10",
    "langfuse>=4.0",
    "grandalf>=0.8",
]

# D-157: ten commands, not one. Until this phase the wheel contained the
# library and the CLI, and NOTHING ELSE that this project needs to be
# operated -- both MCP servers, corpus ingest, the health check, the
# golden-set harness, the store reset and the two memory tools all lived
# in scripts/, outside src/, so `pip install research-agent[all]`
# produced an installation that could not ingest a corpus, could not
# serve the MCP tier it documents, and could not be health-checked. The
# implementations moved into research_agent.servers / research_agent.ops;
# scripts/ keeps a thin launcher for each, so every documented
# `python scripts/<name>.py` still works from a checkout.
#
# NAMES ARE PART OF THE PUBLIC INTERFACE, same as `research-agent`
# itself -- see the versioning note above. Prefixed so an installed
# environment's PATH stays legible about where they came from.
[project.scripts]
research-agent = "research_agent.cli:main"
research-agent-mcp-corpus = "research_agent.servers.corpus:main"
research-agent-mcp-web = "research_agent.servers.web_search:main"
research-agent-ingest = "research_agent.ops.ingest:main"
research-agent-check = "research_agent.ops.check_services:main"
research-agent-analyze = "research_agent.ops.analyze_runs:main"
research-agent-eval = "research_agent.ops.eval_suite:main"
research-agent-reset = "research_agent.ops.reset_stores:main"
research-agent-gc-memory = "research_agent.ops.gc_memory:main"
research-agent-inspect-memory = "research_agent.ops.inspect_memory:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_agent*"]

# NOTE: pytest configuration deliberately stays in pytest.ini, not here.
# pytest.ini takes PRECEDENCE over pyproject.toml's [tool.pytest.ini_options],
# so duplicating it here would create a second copy that silently does
# nothing -- and pytest.ini's filterwarnings=always is load-bearing (see
# its own comment for the warnings it stopped hiding).


# ---------------------------------------------------------------------------
# Ruff (D-154)
#
# WHAT IS SELECTED, AND WHY IT IS A SHORT LIST. The rules below are the ones
# that find BUGS or dead code -- things that are wrong regardless of taste:
#
#   E4/E7/E9  import, statement and syntax errors (ruff's own default E subset)
#   F         pyflakes: unused imports, unused locals, undefined names
#   W         trailing whitespace, missing newline at EOF, invalid escapes
#   B         flake8-bugbear: mutable defaults, `assert False`, bare `zip()`,
#             `raise` inside `except` without `from`
#   C4        comprehension and collection-call correctness
#
# The repository passes all of them with ZERO violations, which is the only
# state in which a linter is worth having in a project someone else reads.
# Getting there found real cruft, not style: 11 unused imports, 3 dead
# locals, a `zip()` that would truncate silently, an `assert False` that
# `python -O` deletes, and 4 tests asserting a blind `Exception` that would
# pass for a typo in the test itself.
#
# WHAT IS DELIBERATELY NOT SELECTED, with the count each would produce:
#
#   E501 (line-too-long)  192 at ruff's default 88. This codebase wraps at
#         79 by hand: p50 is 57 characters, p99 is 84, and only 34 lines in
#         43,000 exceed 100. A cap would be re-litigating a convention the
#         code already follows more tightly than the tool would ask.
#   UP    ~500. Modernising `List[str]` to `list[str]` is a real improvement
#         and a 500-line diff across 70 files. It is a change to make on
#         purpose, in its own commit, not as a side effect of adding a
#         linter. Run `ruff check --select UP --fix` when you want it.
#   I     77 files. Same reasoning: `ruff check --select I --fix` sorts every
#         import block in one pass, and that pass should be its own commit.
#   ARG   275. WRONG for this codebase, not merely noisy. It flags unused
#         function arguments, and this design is built on closures and
#         Protocol implementations where an unused parameter IS the
#         contract -- every node factory in agents/, every ToolFn, every
#         ReportPass.fn. Selecting it would mean 275 noqa comments
#         documenting that the architecture is intentional.
#   SIM/RET  26. Style opinions that argue with deliberate explicitness --
#         `contextlib.suppress` in place of a try/except that carries a
#         comment explaining what is being swallowed, for instance.
#
# HOW TO RUN IT:
#     pip install ruff
#     ruff check .            # expect: All checks passed!
#     ruff check . --fix      # only touches what is safely auto-fixable
#
# NOT wired into CI yet, on purpose: .github/workflows/tests.yml runs the
# test suite and nothing else, so a green badge means the tests pass and
# says so honestly. Add ruff to that workflow when you want the badge to
# mean both -- or run it locally, which is what scripts/sanity.py does
# (D-158): ruff, the suite and an offline run, in cost order, stopping at
# the first failure. CI answers "did the push break it"; the local gate
# answers "is the machine I am about to demo from in a good state", and
# they are different questions.
[tool.ruff]
target-version = "py311"
extend-exclude = ["internal", "logs", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# scripts/ and tests/fixtures/ import after a deliberate sys.path or
# environment set-up step, which E402 (module-level import not at top of
# file) cannot know about. Those sites already carry `# noqa: E402`; this
# keeps the exemption in one visible place rather than scattered.
"scripts/*.py" = ["E402"]
"tests/fixtures/*.py" = ["E402"]

