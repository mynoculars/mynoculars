<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- 
    ================================================================
    SVG LOGO: BINOCULARS / OPTICAL LENS SYMBOL
    ================================================================
    This SVG is structured into clear sections with detailed comments.
    You can easily modify colors, sizes, and positions by adjusting
    the values in each section.
    ================================================================
  -->

  <!-- ============================================================
       DEFS: Definitions for gradients, filters, and masks
       ============================================================ -->
  <defs>
    <!-- Background Gradient -->
    <!-- A soft radial gradient centered in the middle of the canvas -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#e0f7fa"/>   <!-- Lightest cyan -->
      <stop offset="50%" stop-color="#b2ebf2"/>  <!-- Mid cyan -->
      <stop offset="100%" stop-color="#80deea"/> <!-- Darker cyan edge -->
    </radialGradient>

    <!-- Glow Filter for Reflection Dots -->
    <!-- Creates a soft glowing halo around the glare dots -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 
      LEFT LENS MASK 
      This mask creates the crescent cut-out on the right side of the left lens.
      - White areas are visible (solid lens).
      - Black areas are transparent (cut-out, shows background).
    -->
    <mask id="leftLensMask">
      <!-- Base: Full solid white circle (visible) -->
      <circle cx="170" cy="250" r="80" fill="white" />
      <circle cx="325" cy="250" r="120" fill="black" />
    </mask>

    <!-- 
      RIGHT LENS MASK 
      This mask creates the crescent cut-out on the right side of the right lens.
    -->
    <mask id="rightLensMask">
      <!-- Base: Full solid white circle (visible) -->
      <circle cx="330" cy="250" r="80" fill="white" />
      <!-- Cut-out: Black circle on the right side (transparent) -->
      <circle cx="485" cy="250" r="120" fill="black" />
    </mask>
  </defs>

  <!-- ============================================================
       BACKGROUND: Soft cyan gradient fill
       ============================================================ -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>

  <!-- ============================================================
       CORNER BRACKETS: Decorative UI elements
       - Positions: 20px from edges, 40px length, with 15px inner corners
       - Color: #4dd0e1 (bright cyan), 50% opacity
       ============================================================ -->
  <!-- Top-Left Bracket -->
  <polyline points="20,20 60,20 60,35 35,35 35,60 20,60" fill="none" stroke="#4dd0e1" stroke-width="2" opacity="0.5"/>
  <!-- Top-Right Bracket -->
  <polyline points="480,20 440,20 440,35 465,35 465,60 480,60" fill="none" stroke="#4dd0e1" stroke-width="2" opacity="0.5"/>
  <!-- Bottom-Left Bracket -->
  <polyline points="20,480 60,480 60,465 35,465 35,440 20,440" fill="none" stroke="#4dd0e1" stroke-width="2" opacity="0.5"/>
  <!-- Bottom-Right Bracket -->
  <polyline points="480,480 440,480 440,465 465,465 465,440 480,440" fill="none" stroke="#4dd0e1" stroke-width="2" opacity="0.5"/>

  <!-- ============================================================
       LEFT BINOCULAR BODY: Concentric Rings
       - Center: cx=170, cy=250
       - Spacing between rings is reduced to 1.5px for a tighter look
       - Outermost ring is 8px thick and uses a very dark shade (#002b26)
       ============================================================ -->
  <!-- Outermost Ring (Thick, Dark Shade) -->
  <ellipse cx="170" cy="250" rx="95" ry="95" fill="none" stroke="#002b26" stroke-width="8" opacity="0.95"/>
  <!-- Inner Concentric Rings (Tighter spacing) -->
  <ellipse cx="170" cy="250" rx="93.5" ry="93.5" fill="none" stroke="#00695c" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="170" cy="250" rx="92" ry="92" fill="none" stroke="#00695c" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="170" cy="250" rx="90.5" ry="90.5" fill="none" stroke="#00695c" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="170" cy="250" rx="89" ry="89" fill="none" stroke="#00695c" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="170" cy="250" rx="87.5" ry="87.5" fill="none" stroke="#00695c" stroke-width="1.5" opacity="0.8"/>

  <!-- ============================================================
       RIGHT BINOCULAR BODY: Concentric Rings
       - Center: cx=330, cy=250
       - Identical structure to the left side
       ============================================================ -->
  <!-- Outermost Ring (Thick, Dark Shade) -->
  <ellipse cx="330" cy="250" rx="95" ry="95" fill="none" stroke="#002b26" stroke-width="8" opacity="0.95"/>
  <!-- Inner Concentric Rings (Tighter spacing) -->
  <ellipse cx="330" cy="250" rx="93.5" ry="93.5" fill="none" stroke="#00695c" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="330" cy="250" rx="92" ry="92" fill="none" stroke="#00695c" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="330" cy="250" rx="90.5" ry="90.5" fill="none" stroke="#00695c" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="330" cy="250" rx="89" ry="89" fill="none" stroke="#00695c" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="330" cy="250" rx="87.5" ry="87.5" fill="none" stroke="#00695c" stroke-width="1.5" opacity="0.8"/>

  <!-- ============================================================
       LEFT LENS: Inner Filled Circle with Crescent Cut-out
       - The mask removes a circular chunk from the right side
       - This creates the "prism" or "internal lens" effect from the ASCII
       - Base color: #00332e (very dark teal)
       ============================================================ -->
  <!-- Solid Lens with Mask applied -->
  <circle cx="170" cy="250" r="80" fill="#00332e" mask="url(#leftLensMask)"/>
  
  <!-- ============================================================
       RIGHT LENS: Inner Filled Circle with Crescent Cut-out
       - Mirrors the left lens structure
       ============================================================ -->
  <!-- Solid Lens with Mask applied -->
  <circle cx="330" cy="250" r="80" fill="#00332e" mask="url(#rightLensMask)"/>
  
  <!-- ============================================================
       LENS TEXT: "A" and "I"
       - Text is placed in the solid left half of each lens
       - Font size is doubled (96px), extra bold (900), and bright white
       - "A" is on the left lens, "I" is on the right lens
       ============================================================ -->
  <!-- Text "A" on the Left Lens -->
  <!-- Positioned at x=130 to sit comfortably in the left solid area -->
  <text x="160" y="250" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="900" fill="#ffffff" opacity="0.95">A</text>

  <!-- Text "I" on the Right Lens -->
  <!-- Positioned at x=290 to sit comfortably in the left solid area -->
  <text x="340" y="250" text-anchor="middle" dominant-baseline="central" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="900" fill="#ffffff" opacity="0.95">I</text>

  <!-- ============================================================
       REFLECTION GLARE DOTS (Top-Left of Lenses)
       - Mimics light reflection on the curved glass lens surface
       - Moved further top-left for a realistic binocular glare effect
       ============================================================ -->
  <!-- Left Lens Reflection Dot -->
  <circle cx="125" cy="195" r="14" fill="#b2ebf2" opacity="0.85" filter="url(#glow)"/>
  <!-- Right Lens Reflection Dot -->
  <circle cx="285" cy="195" r="14" fill="#b2ebf2" opacity="0.85" filter="url(#glow)"/>

  <!-- ============================================================
       ORBITAL DECORATIVE DOTS
       - Small dots placed around the outermost rings
       - Represents orbital elements or decorative accents
       - Color: #4dd0e1 (bright cyan)
       ============================================================ -->
  <!-- Left Lens Orbital Dots -->
  <circle cx="75" cy="250" r="3.5" fill="#4dd0e1" opacity="0.8"/>   <!-- Left side -->
  <circle cx="265" cy="250" r="3.5" fill="#4dd0e1" opacity="0.8"/>  <!-- Right side -->
  <circle cx="170" cy="155" r="3.5" fill="#4dd0e1" opacity="0.8"/>  <!-- Top side -->
  <circle cx="170" cy="345" r="3.5" fill="#4dd0e1" opacity="0.8"/>  <!-- Bottom side -->

  <!-- Right Lens Orbital Dots -->
  <circle cx="235" cy="250" r="3.5" fill="#4dd0e1" opacity="0.8"/>  <!-- Left side -->
  <circle cx="425" cy="250" r="3.5" fill="#4dd0e1" opacity="0.8"/>  <!-- Right side -->
  <circle cx="330" cy="155" r="3.5" fill="#4dd0e1" opacity="0.8"/>  <!-- Top side -->
  <circle cx="330" cy="345" r="3.5" fill="#4dd0e1" opacity="0.8"/>  <!-- Bottom side -->

  <!-- ============================================================
       ANTENNA PINS (Top & Bottom edges of the binoculars)
       - Vertical lines extending outward from the rings
       - Each pin is capped with a small red circle (cx, cy, r=3.5)
       - Color: #26a69a for lines, #ff7043 for the tips
       ============================================================ -->

  <!-- LEFT SIDE: Top Antenna Pins -->
  <line x1="120" y1="155" x2="120" y2="115" stroke="#26a69a" stroke-width="2"/>
  <circle cx="120" cy="112" r="3.5" fill="#ff7043"/>
  
  <line x1="145" y1="145" x2="145" y2="105" stroke="#26a69a" stroke-width="2"/>
  <circle cx="145" cy="102" r="3.5" fill="#ff7043"/>
  
  <line x1="170" y1="140" x2="170" y2="100" stroke="#26a69a" stroke-width="2"/>
  <circle cx="170" cy="97" r="3.5" fill="#ff7043"/>

  <!-- LEFT SIDE: Bottom Antenna Pins -->
  <line x1="120" y1="345" x2="120" y2="385" stroke="#26a69a" stroke-width="2"/>
  <circle cx="120" cy="388" r="3.5" fill="#ff7043"/>
  
  <line x1="145" y1="355" x2="145" y2="395" stroke="#26a69a" stroke-width="2"/>
  <circle cx="145" cy="398" r="3.5" fill="#ff7043"/>
  
  <line x1="170" y1="360" x2="170" y2="400" stroke="#26a69a" stroke-width="2"/>
  <circle cx="170" cy="403" r="3.5" fill="#ff7043"/>

  <!-- RIGHT SIDE: Top Antenna Pins -->
  <line x1="330" y1="140" x2="330" y2="100" stroke="#26a69a" stroke-width="2"/>
  <circle cx="330" cy="97" r="3.5" fill="#ff7043"/>
  
  <line x1="355" y1="145" x2="355" y2="105" stroke="#26a69a" stroke-width="2"/>
  <circle cx="355" cy="102" r="3.5" fill="#ff7043"/>
  
  <line x1="380" y1="155" x2="380" y2="115" stroke="#26a69a" stroke-width="2"/>
  <circle cx="380" cy="112" r="3.5" fill="#ff7043"/>

  <!-- RIGHT SIDE: Bottom Antenna Pins -->
  <line x1="330" y1="360" x2="330" y2="400" stroke="#26a69a" stroke-width="2"/>
  <circle cx="330" cy="403" r="3.5" fill="#ff7043"/>
  
  <line x1="355" y1="355" x2="355" y2="395" stroke="#26a69a" stroke-width="2"/>
  <circle cx="355" cy="398" r="3.5" fill="#ff7043"/>
  
  <line x1="380" y1="345" x2="380" y2="385" stroke="#26a69a" stroke-width="2"/>
  <circle cx="380" cy="388" r="3.5" fill="#ff7043"/>

</svg>