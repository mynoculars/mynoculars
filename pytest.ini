[pytest]
# filterwarnings=always overrides Python's default warning-filter action
# ("default", which shows a given warning only ONCE per exact source
# location, then silently suppresses every later occurrence in the same
# process). With 97+ tests sharing one process, that default made pytest's
# own "warnings summary" collapse a warning that legitimately fired in
# many different tests down into a single grouped line with a bare count
# -- and, separately, hid at least one distinct warning (a ResourceWarning
# for an unclosed file in tests/test_core.py) entirely, since its FIRST
# occurrence happened to be suppressed by an earlier, unrelated warning
# claiming that "once per location" slot first.
#
# "always" means every occurrence is shown to pytest's warning capture,
# so the summary correctly reflects what actually happened, and nothing
# stays invisible just because something else warned first.
filterwarnings =
    always
