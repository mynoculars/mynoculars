[pytest]
testpaths = tests
# Import mode matters: tests/conftest.py is imported BY NAME from
# tests/unit/test_storage_opensearch_store.py (for UNROUTABLE_URL), which
# needs tests/ to be a real package on sys.path rather than a rootdir-
# relative directory. tests/__init__.py does not exist, so prepend mode --
# pytest's default -- is what makes that import resolve.
addopts = -n auto --dist loadfile

markers =
    slow: opens a real socket or otherwise waits on a timeout. Deselect
        with -m "not slow" for a tight edit/run loop; CI runs everything.

# -n auto --dist loadfile (P8-2 / D-141)
#
# `loadfile`, not the default `load`: it keeps every test in one module on
# one worker. Two files here spawn subprocess MCP servers
# (test_tools_mcp_client.py, test_mcp_web_search_server.py) and one drives
# a ThreadPoolExecutor concurrency assertion; scattering their tests across
# workers gains nothing and costs a process spawn per shard.
#
# Verified before adoption, not assumed: 1019/1019 passed at -n0, -n4 and
# -n8 with no flakes and no ordering dependency, which is not a given for a
# suite with subprocess fixtures and a threading.local retrieval counter.
#
# On a low-core machine `-n auto` can be SLOWER than serial -- each worker
# pays the ~2.2s research_agent/langgraph/fastapi import. Measured on a
# 2-core container: 17.1s serial vs 23.6s at -n4. Override per-invocation
# with `-p no:xdist` or `-n0`; the win is on the 8+ core machines this is
# aimed at, and on Windows where per-test I/O latency dominates.

filterwarnings =
    always
# filterwarnings=always overrides Python's default warning-filter action
# ("default", which shows a given warning only ONCE per exact source
# location, then silently suppresses every later occurrence in the same
# process). With the whole suite sharing one process, that default made
# pytest's own "warnings summary" collapse a warning that legitimately
# fired in many different tests down into a single grouped line with a bare
# count -- and, separately, hid at least one distinct warning entirely,
# since its FIRST occurrence happened to be suppressed by an earlier,
# unrelated warning claiming that "once per location" slot first.
#
# "always" means every occurrence is shown to pytest's warning capture, so
# the summary correctly reflects what actually happened, and nothing stays
# invisible just because something else warned first.
#
# NOTE (P8-2): under xdist the ORDER and COUNT of captured warnings is not
# deterministic -- see conftest.py::pytest_terminal_summary, which now
# says so rather than printing a number that changes between runs.
